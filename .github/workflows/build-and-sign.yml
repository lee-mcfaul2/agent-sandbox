name: build-and-sign
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: build + push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUNDLE_SOURCE=testdata
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.v }}
            ghcr.io/${{ github.repository }}:latest
      - name: cosign keyless sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
      - name: sbom (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: sbom.spdx.json
  provenance:
    needs: image
    permissions:
      id-token: write
      contents: read
      actions: read
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.image.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      # provenance/final pushes the attestation to ghcr.io; without explicit
      # registry creds the reusable workflow's docker login is skipped and
      # the final step exits 27 with SUCCESS=false even though detect-env +
      # generator both succeed. agent-gateway's workflow has the same pair.
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0
      - uses: sigstore/cosign-installer@v3
      # docker/login-action writes ~/.docker/config.json, which helm 3.7+ uses
      # as fallback OCI credentials AND cosign reads for signature pushes.
      # Replaces an earlier `echo $GITHUB_TOKEN | helm registry login` step
      # that 401'd UNAUTHORIZED on the bearer-token endpoint (probably the
      # trailing newline from `echo` corrupting --password-stdin).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: package chart with image digest
        run: |
          helm package deploy/helm \
            --app-version "${GITHUB_REF_NAME#v}" \
            --version    "${GITHUB_REF_NAME#v}" \
            --destination dist/
      - name: push chart as OCI
        id: push-chart
        run: |
          OUT=$(helm push dist/agent-sandbox-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1)
          echo "$OUT"
          DIGEST=$(echo "$OUT" | grep -oE 'sha256:[a-f0-9]+' | head -n1)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: cosign sign chart
        env:
          DIGEST: ${{ steps.push-chart.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/agent-sandbox@${DIGEST}"
